server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

# ── 文件上传大小限制 ──────────────────────────────────────
spring.servlet.multipart.max-file-size: 10MB
spring.servlet.multipart.max-request-size: 30MB

spring:
  application:
    name: qinhu-oasis-backend

  # ── 数据源 ──────────────────────────────────────────────
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/qinhu_oasis?useUnicode=true&characterEncoding=utf8&useUnicode=true&serverTimezone=Asia/Shanghai
    username: root
    password: "123456"
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # ── Redis ────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      password:           # 如有密码填写此处
      database: 4
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  # ── 消息国际化 ────────────────────────────────────────────
  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: 3600s

  # ── Jackson ──────────────────────────────────────────────
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ── MyBatis ──────────────────────────────────────────────
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true   # 驼峰转换: create_time → createTime
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-statement-timeout: 30
  type-aliases-package: com.qinhu.oasis.**.entity

# ── Minio ────────────────────────────────────────────────
minio:
  endpoint: http://localhost:9000
  access-key: root
  secret-key: "12345678"
  buckets:
    public-static: qosh-public-static       # 景区地图、官方配图、公共图标
    interpreter-certs: qosh-interpreter-certs # 学生英语证书（私密）
    ugc-images: qosh-ugc-images              # 游客攻略图、评论图、用户头像
    sys-assets: qosh-sys-assets              # 报表导出、日志备份

# ── JWT ──────────────────────────────────────────────────
jwt:
  secret: qinhu-oasis-jwt-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 604800   # 7天，单位秒

# ── 第三方 API ────────────────────────────────────────────

