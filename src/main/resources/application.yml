server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true

# ── 文件上传大小限制 ──────────────────────────────────────
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  application:
    name: qinhu-oasis-backend

  # ── 加载本地敏感配置（本地开发使用 application-local.yml，不提交 Git）──
  profiles:
    active: local

  # ── 数据源（具体连接信息在 application-local.yml 中）──────
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  # ── Redis（具体连接信息在 application-local.yml 中）────────
  data:
    redis:
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 2000ms

  # ── 消息国际化 ────────────────────────────────────────────
  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: 3600s

  # ── Jackson ──────────────────────────────────────────────
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ── MyBatis ──────────────────────────────────────────────
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true   # 驼峰转换: create_time → createTime
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    default-statement-timeout: 30
  type-aliases-package: com.qinhu.oasis.**.entity

# ── Minio（bucket 名称公开，密钥在 application-local.yml）──
minio:
  endpoint: http://localhost:9000
  buckets:
    public-static: qosh-public-static
    interpreter-certs: qosh-interpreter-certs
    ugc-images: qosh-ugc-images
    sys-assets: qosh-sys-assets

# ── JWT ──────────────────────────────────────────────────
jwt:
  expiration: 604800   # 7天，secret 在 application-local.yml 中

# ── 第三方 API（base-url 公开，密钥在 application-local.yml）─
third-party:
  hefeng-weather:
    base-url: https://mt7dnah6du.re.qweatherapi.com/v7
  amap:
    base-url: https://restapi.amap.com/v3
  baidu-translate:
    base-url: https://fanyi-api.baidu.com/api/trans/vip/translate

# ── 日志 ────────────────────────────────────────────────
logging:
  level:
    com.qinhu.oasis: DEBUG
    org.springframework.web: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"